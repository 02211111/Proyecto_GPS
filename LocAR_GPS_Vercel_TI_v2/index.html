<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR GPS Demo</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; }
    #ar-canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
    #panel {
      position:fixed; top:10px; left:10px; right:10px;
      background:rgba(0,0,0,0.7); color:#fff; padding:10px; border-radius:8px;
      font-family:Arial,sans-serif; font-size:14px; z-index:10;
    }
    #start { margin-top:8px; padding:8px; font-size:15px; }
  </style>
</head>
<body>
  <canvas id="ar-canvas"></canvas>

  <div id="panel">
    <b>AR GPS Demo</b><br>
    <span id="coords">GPS: esperando...</span><br>
    <span id="accuracy">Precisión: —</span><br>
    <span id="status">Pulsa “INICIAR AR” y permite cámara + ubicación.</span><br>
    <button id="start">INICIAR AR</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
