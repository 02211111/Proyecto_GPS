<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocAR GPS - Laboratorio de Redes</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; }
    #ar-canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
    #panel {
      position:fixed; top:10px; left:10px; right:10px;
      background:rgba(0,0,0,0.7); color:#fff; padding:12px; border-radius:10px;
      font-size:14px; z-index:10;
    }
    #start {
      margin-top:10px; padding:10px; border:0; border-radius:6px;
      font-size:16px; font-weight:bold; background:#fff; color:#000;
    }
    #legend {
      position:fixed; bottom:10px; left:10px; right:10px;
      background:rgba(0,0,0,0.7); color:#fff; padding:8px; border-radius:10px;
      font-size:12px; z-index:10;
    }
  </style>
</head>
<body>
  <canvas id="ar-canvas"></canvas>

  <div id="panel">
    <b>AR GPS — LocAR.js</b><br>
    <span id="coords">GPS: esperando señal...</span><br>
    <span id="accuracy">Precisión: —</span><br>
    <span id="distance">Distancia al Laboratorio: —</span>
    <div id="status">Pulsa “INICIAR AR” y permite cámara + ubicación.</div>
    <button id="start">INICIAR AR</button>
  </div>

  <div id="legend">
    Cubos: rojo=Norte, amarillo=Sur, celeste=Oeste, verde=Este, magenta=Laboratorio.
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
