<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self)" />
  <title>AR GPS - Laboratorio de Redes</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
    #panel {
      position: fixed; z-index: 10; top: 12px; left: 12px; right: 12px;
      background: rgba(0, 0, 0, .72); color: #fff; border-radius: 12px; padding: 12px;
      font-size: 14px; line-height: 1.4;
    }
    #panel b { font-size: 17px; }
    #start {
      width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 9px;
      font-size: 17px; font-weight: bold; background: white; color: black;
      cursor: pointer;
    }
    #start:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status { margin-top: 8px; }
    #legend {
      position: fixed; z-index: 10; left: 12px; right: 12px; bottom: 12px;
      background: rgba(0, 0, 0, .72); color: white; border-radius: 12px; padding: 10px; font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- La escena de A-Frame se renderizará aquí -->
  <a-scene
    id="ar-scene"
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- La cámara que controla la vista en realidad aumentada -->
    <a-camera
      id="ar-camera"
      gps-new-camera="gpsMinDistance: 3"
      look-controls="enabled: false"
      wasd-controls="enabled: false"
    ></a-camera>

    <!-- Los objetos 3D se añadirán dinámicamente con JavaScript -->
    <a-entity id="dynamic-entities"></a-entity>
  </a-scene>

  <div id="panel">
    <b>AR por ubicación — AR.js</b><br>
    <span id="coords">GPS: todavía no iniciado</span><br>
    <span id="accuracy">Precisión: —</span><br>
    <span id="distance">Distancia al Laboratorio: —</span>
    <div id="status">Pulsa “INICIAR AR” y acepta los permisos.</div>
    <button id="start">INICIAR AR</button>
  </div>

  <div id="legend">
    Calibración: rojo=Norte, amarillo=Sur, celeste=Oeste, verde=Este.
    Magenta=“Laboratorio de Redes”.
  </div>

  <!-- Librerías de AR.js y A-Frame desde CDN -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js'></script>
  <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'></script>
  
  <!-- Tu script principal -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
