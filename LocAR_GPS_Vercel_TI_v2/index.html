<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self)" />
  <title>AR GPS - Laboratorio de Redes</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
    #panel {
      position: fixed; z-index: 20; top: 12px; left: 12px; right: 12px;
      background: rgba(0, 0, 0, .8); color: #fff; border-radius: 12px; padding: 12px;
      font-size: 14px; line-height: 1.4; pointer-events: auto;
    }
    #panel b { font-size: 17px; }
    #start {
      width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 9px;
      font-size: 17px; font-weight: bold; background: white; color: black; cursor: pointer;
    }
    #start:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 8px; }
    #legend {
      position: fixed; z-index: 20; left: 12px; right: 12px; bottom: 12px;
      background: rgba(0, 0, 0, .8); color: white; border-radius: 12px; padding: 10px; font-size: 12px;
    }
    #debug {
      position: fixed; z-index: 20; top: 200px; left: 12px; right: 12px;
      background: rgba(0, 0, 0, .6); color: #0f0; font-family: monospace;
      font-size: 10px; padding: 6px; border-radius: 6px; max-height: 100px; overflow: auto;
    }
  </style>
</head>
<body>
  <a-scene
    id="ar-scene"
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera
      id="ar-camera"
      gps-new-camera="gpsMinDistance: 0.5; gpsMinAccuracy: 200;"
      look-controls="enabled: false"
      wasd-controls="enabled: false"
    ></a-camera>
  </a-scene>

  <div id="panel">
    <b>AR por ubicación — AR.js</b><br>
    <span id="coords">GPS: todavía no iniciado</span><br>
    <span id="accuracy">Precisión: —</span><br>
    <span id="distance">Distancia al Laboratorio: —</span>
    <div id="status">Pulsa "INICIAR AR" y acepta los permisos.</div>
    <button id="start">INICIAR AR</button>
  </div>

  <div id="debug">Debug: esperando…</div>

  <div id="legend">
    Rojo=Norte · Amarillo=Sur · Celeste=Oeste · Verde=Este · Magenta=Laboratorio.
  </div>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/@ar-js-org/ar.js@3.4.5/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://unpkg.com/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
